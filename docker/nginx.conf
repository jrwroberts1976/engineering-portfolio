# ============================================================================
# Engineering Portfolio - Nginx Configuration
# ============================================================================
#
# Astro generates a static website in the /dist directory.
# The Docker build copies those files into /usr/share/nginx/html.
#
# Nginx serves the generated HTML, CSS, JavaScript, images and downloadable
# files. No Node.js runtime is required in production.
#

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # Health check
    # ------------------------------------------------------------------------
    #
    # Docker uses this endpoint to verify that Nginx is responding.
    #

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ------------------------------------------------------------------------
    # Static website routing
    # ------------------------------------------------------------------------
    #
    # Astro creates directories such as:
    #
    #   /projects/index.html
    #   /projects/crowdsec/index.html
    #   /architecture/index.html
    #
    # The $uri/ check allows clean URLs without ".html".
    #

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ------------------------------------------------------------------------
    # Static asset caching
    # ------------------------------------------------------------------------

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Prevent dotfiles from being served.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------------
    # Error handling
    # ------------------------------------------------------------------------

    error_page 404 /404.html;
}
