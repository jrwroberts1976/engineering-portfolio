name: Cloudflare Pages Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Build and deploy Pages preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: engineering-portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured."
            exit 2
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 2
          fi

          echo "Cloudflare credential gate: PASS"

      - name: Ensure Pages project exists
        shell: bash
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT"
          BODY="$(mktemp)"

          HTTP_CODE="$(
            curl -sS               -o "$BODY"               -w '%{http_code}'               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               "$API"
          )"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Cloudflare Pages project already exists."
            rm -f "$BODY"
            exit 0
          fi

          if [ "$HTTP_CODE" != "404" ]; then
            echo "Unable to query Cloudflare Pages project (HTTP $HTTP_CODE)."
            jq -r '.errors[]?.message // empty' "$BODY"
            rm -f "$BODY"
            exit 3
          fi

          CREATE_BODY="$(mktemp)"
          CREATE_CODE="$(
            curl -sS               -o "$CREATE_BODY"               -w '%{http_code}'               -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"engineering-portfolio","production_branch":"main"}'               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          )"

          if [ "$CREATE_CODE" != "200" ]; then
            echo "Cloudflare Pages project creation failed (HTTP $CREATE_CODE)."
            jq -r '.errors[]?.message // empty' "$CREATE_BODY"
            rm -f "$BODY" "$CREATE_BODY"
            exit 4
          fi

          echo "Cloudflare Pages project created."
          rm -f "$BODY" "$CREATE_BODY"

      - name: Deploy migration preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=engineering-portfolio --branch=migration-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
