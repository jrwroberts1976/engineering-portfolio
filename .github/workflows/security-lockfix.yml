name: Temporary dependency lock fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh vulnerable dependencies in lockfile
        run: npm audit fix --package-lock-only

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix vulnerable npm dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
