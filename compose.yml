services:
  engineering-portfolio:
    container_name: engineering-portfolio

    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GRAFANA_SECURITY_DASHBOARD: ${PUBLIC_GRAFANA_SECURITY_DASHBOARD:-}
        PUBLIC_GRAFANA_PLATFORM_DASHBOARD: ${PUBLIC_GRAFANA_PLATFORM_DASHBOARD:-}
        PUBLIC_GRAFANA_BIRDNET_DASHBOARD: ${PUBLIC_GRAFANA_BIRDNET_DASHBOARD:-}
        PUBLIC_HOMELAB_DEFENDER_URL: ${PUBLIC_HOMELAB_DEFENDER_URL:-}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_SOURCE: ${BUILD_SOURCE:-https://github.com/jrwroberts1976/engineering-portfolio}

    image: james-roberts/engineering-portfolio:local

    restart: unless-stopped

    ports:
      - "${PORTFOLIO_PORT:-8095}:80"

    networks:
      - apps

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  apps:
    external: true
    name: homelab_apps
